ylight",title:"Rain on the Skylight",tag:"field notes",date:"Tue · 1:15 AM",duration:"40:03",startSec:1*3600+900+22,lines:[{text:"Note to self — the rain started around eleven, tapping the skylight like it wanted in."},{text:"Recorded forty minutes of it over the studio. No music, just water finding its rhythm."},{text:"Somewhere in the middle, a train went past. You can hear it if you listen low."},{text:"I like thinking someone else is hearing the same rain from another roof."},{text:"Keep the take. Fade it under the intro of episode nine."}]},{id:"slow-hours",title:"The Slow Hours — Sleep & Dreams, Pt. 2",tag:"podcast",date:"Mon · 11:48 PM",duration:"1:12:40",startSec:23*3600+2880+40,lines:[{speaker:"Ada",text:"Most people don't fall asleep all at once. They arrive in layers."},{speaker:"Ada",text:"First the body gets heavy, then the thoughts start losing their edges."},{speaker:"Ben",text:"Like a conversation in the next room you stop trying to follow."},{speaker:"Ada",text:"Exactly. And dreams are what happens when you finally stop knocking."},{speaker:"Ben",text:"So the trick isn't to chase sleep. It's to stop guarding the door."},{speaker:"Ada",text:"You'd be surprised how much of insomnia is just politeness — refusing to let go."}]},{id:"diner-fifth",title:"Diner on Fifth, 3:07 A.M.",tag:"memo",date:"Sun · 3:07 AM",duration:"12:56",startSec:3*3600+420+11,lines:[{text:"Two coffees at the counter, steam curling like it has nowhere to be."},{text:"The cook hums something old. The jukebox is off, but you can feel it waiting."},{text:"She says the night shift is the honest shift. Nobody performs at three in the morning."},{text:"I write that down on a napkin. It smudges before I'm done."},{text:"Outside, a taxi idles in the rain like it's thinking it over."}]},{id:"study-take4",title:"Voice Memo — Study Session, Take 4",tag:"voice memo",date:"Sat · 12:26 AM",duration:"03:41",startSec:0*3600+1560+5,lines:[{text:"Okay, last pass before bed. Keep this one short."},{
