<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="panel.css">
<link rel="stylesheet" href="zip-overlay.css">
<style>html,body{height:auto;margin:0;background:#111}
#wrap{height:300px;display:flex;flex-direction:column}
.panel{flex:1;min-height:0;display:flex;flex-direction:column}</style>
</head>
<body data-surface="strip">
<div id="wrap"><section class="panel">
  <div class="captions">
    <div class="captions__bar"><span class="captions__hint">FUNDO: FILME . REPRODUZINDO . AUDIO ORIGINAL</span></div>
    <div class="captions__body">
      <ol class="captions__list" id="caption-list">
        <li class="caption"><span class="caption__time">0:20</span><span class="caption__text">O problema nao e o dinheiro.</span></li>
        <li class="caption"><span class="caption__time">0:21</span><span class="caption__text">E a confianca que voce quebrou ontem a noite.</span></li>
        <li class="caption"><span class="caption__time">0:22</span><span class="caption__text">Eu estava la na hora errada.</span></li>
        <li class="caption"><span class="caption__time">0:23</span><span class="caption__text">Ela disse que o conserto sairia caro.</span></li>
        <li class="caption"><span class="caption__time">0:24</span><span class="caption__text">Ninguem sai daqui ate a verdade aparecer.</span></li>
      </ol>
    </div>
  </div>
  <section class="stripbar" id="strip-controls">
    <span class="stripbar__brand">sotto</span>
    <span class="stripbar__grip"></span>
    <button class="strip-button strip-button--toggle" aria-pressed="false"><span class="strip-button__label">live</span></button>
    <span class="stripbar__state"><span class="stripbar__dot"></span>CAPTIONS ON</span>
  </section>
</section></div>
</body></html>
