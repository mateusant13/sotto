<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- No remote content, no inline event handlers: everything is local files
         reached through the preload bridge. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;"
    />
    <title>Sotto</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <!-- The slab. `.panel` fills the whole window and is the only element that
         takes pointer events. There is NO transparent margin inside this window:
         dockRight() in main.js spends PANEL_MARGIN outside it, between the window
         and the work-area edge, and sizes the window to the panel. Measured
         2026-10-06 by dom-probe.js — an inset here shows up as dead transparent
         space inside the always-on-top region and clips the slab's own shadow.

         TWO SECTIONS, stacked, and the shape is the owner's:
           TOP    `.history`   the accumulated transcript ("redux") — a feed laid
                               out along the panel, persisted on disk, searchable.
           BOTTOM `.captions`  the LIVE caption box — the streaming caption
                               growing line by line. This is the focus.
         The footer carries the status line. -->
    <main class="panel" id="panel">
      <header class="panel__header">
        <div class="wordmark">
          <!-- The mark from brand/logo.svg: three audio bars and the panel slab,
               in the same #7DD3FC -> #A78BFA gradient. -->
          <svg class="wordmark__mark" viewBox="0 0 64 64" role="img" aria-label="Sotto">
            <defs>
              <linearGradient id="sotto-accent" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#7DD3FC" />
                <stop offset="100%" stop-color="#A78BFA" />
              </linearGradient>
            </defs>
            <rect
              x="30"
              y="6"
              width="28"
              height="52"
              rx="6"
              fill="#0B0F14"
              stroke="url(#sotto-accent)"
              stroke-width="2"
            />
            <rect x="35" y="14" width="18" height="3" rx="1.5" fill="url(#sotto-accent)" opacity="0.95" />
            <rect x="35" y="22" width="13" height="3" rx="1.5" fill="#7DD3FC" opacity="0.45" />
            <rect x="35" y="30" width="16" height="3" rx="1.5" fill="#A78BFA" opacity="0.55" />
            <rect x="8" y="26" width="4" height="12" rx="2" fill="#7DD3FC" opacity="0.55" />
            <rect x="15" y="18" width="4" height="28" rx="2" fill="url(#sotto-accent)" />
            <rect x="22" y="23" width="4" height="18" rx="2" fill="#A78BFA" opacity="0.75" />
          </svg>
          <div class="wordmark__text">
            <h1 class="wordmark__name">Sotto</h1>
            <p class="wordmark__tag">live captions</p>
          </div>
        </div>

        <div class="panel__controls">
          <button
            type="button"
            class="icon-button"
            id="clear-button"
            title="Clear the live caption box"
            aria-label="Clear the live caption box"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.2a1 1 0 0 0 1 .8h3.8a1 1 0 0 0 1-.8l.6-8.2"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button
            type="button"
            class="icon-button"
            id="hide-button"
            title="Hide (Alt+C)"
            aria-label="Hide panel"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M4 4l8 8M12 4l-8 8"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
      </header>

      <!-- ── TOP: the history feed ─────────────────────────────────────────
           The general transcript as it happened, read back from disk. Every
           committed caption is appended to <root>/<YYYY-MM-DD>/<HH>.md, so this
           feed survives a restart and is what the search operates on. The root
           is printed here so the owner always knows where his data lives. -->
      <section class="history" id="history" aria-label="Transcript history">
        <div class="history__bar">
          <span class="history__label">History &middot; Redux</span>
          <button
            type="button"
            class="history__path"
            id="history-root"
            title="Open the history folder"
          >&hellip;</button>
        </div>

        <div class="history__tools">
          <form class="search" id="search-form" role="search">
            <input
              type="search"
              class="search__input"
              id="search-input"
              placeholder="Search history&hellip;"
              aria-label="Search history"
              autocomplete="off"
              spellcheck="false"
            />
            <button type="submit" class="search__button" id="search-button" title="Search history">
              Search
            </button>
            <button type="button" class="search__clear" id="search-clear" title="Clear search" hidden>
              Clear
            </button>
          </form>
          <button
            type="button"
            class="reveal-button"
            id="reveal-button"
            title="Show the selected entry in the OS file manager"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M1.5 4.2a1 1 0 0 1 1-1h3.1l1.3 1.4h5.6a1 1 0 0 1 1 1v6.2a1 1 0 0 1-1 1h-10a1 1 0 0 1-1-1z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linejoin="round"
              />
            </svg>
            <span>Show in folder</span>
          </button>
        </div>

        <p class="history__note" id="history-status" hidden></p>

        <ol class="history__list" id="history-list" aria-live="off"></ol>
      </section>

      <!-- ── BOTTOM: the live caption box ──────────────────────────────────
           The focus of the panel. Lines arrive through the bridge, are
           formulated by caption-formulation.js, and a committed line is added
           here AND appended to the history feed above. -->
      <section class="captions" id="captions" aria-live="polite" aria-label="Live caption">
        <div class="captions__bar">
          <span class="history__label">Live &middot; NVIDIA</span>
          <span class="captions__hint" id="captions-hint"></span>
        </div>
        <div class="captions__body" id="captions-body">
          <div class="captions__placeholder" id="placeholder">
            <div class="listening" aria-hidden="true">
              <span></span><span></span><span></span><span></span><span></span>
            </div>
            <p class="captions__placeholder-title">Waiting for audio</p>
            <p class="captions__placeholder-body">
              Nothing is being transcribed yet. Captions appear here line by line the
              moment audio reaches Sotto.
            </p>
          </div>
          <!-- `hidden` because the empty state shows the placeholder instead.
               panel.js clears this attribute on the first caption; without it the
               empty box still occupies the top of the caption area. -->
          <ol class="captions__list" id="caption-list" hidden></ol>
        </div>
      </section>

      <footer class="status" id="status">
        <span class="status__dot" id="status-dot" aria-hidden="true"></span>
        <span class="status__text" id="status-text">Idle &middot; no audio source</span>
        <span class="status__hint" id="status-hint"><kbd>Alt</kbd>+<kbd>C</kbd></span>
      </footer>
    </main>

    <!-- The text decisions, DOM-free, so the oracle can run them outside
         Electron. Must load BEFORE panel.js, which calls into it at load. -->
    <script src="caption-formulation.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
