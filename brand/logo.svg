<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Sotto">
  <defs>
    <linearGradient id="sotto-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <!-- the overlay panel: a docked slab on the right edge -->
  <rect x="30" y="6" width="28" height="52" rx="6"
        fill="#0B0F14" stroke="url(#sotto-accent)" stroke-width="2"/>

  <!-- live caption lines inside the panel -->
  <rect x="35" y="14" width="18" height="3" rx="1.5" fill="url(#sotto-accent)" opacity="0.95"/>
  <rect x="35" y="22" width="13" height="3" rx="1.5" fill="#7DD3FC" opacity="0.45"/>
  <rect x="35" y="30" width="16" height="3" rx="1.5" fill="#A78BFA" opacity="0.55"/>

  <!-- the audio it is transcribing: three bars, left of the panel -->
  <rect x="8"  y="26" width="4" height="12" rx="2" fill="#7DD3FC" opacity="0.55"/>
  <rect x="15" y="18" width="4" height="28" rx="2" fill="url(#sotto-accent)"/>
  <rect x="22" y="23" width="4" height="18" rx="2" fill="#A78BFA" opacity="0.75"/>
</svg>